<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTIS 대량 신청서 변환 시스템</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ASTIS 스타일 상단 네비게이션 흉내 -->
    <div class="top-nav">
        <span>ASTIS | 농업과학기술정보서비스 - 대량 신청서 자동 변환 시스템 V2</span>
    </div>

    <main class="main-container">
        <header>
            <h1>신청서 대량 엑셀 변환 시스템</h1>
            <p>다수의 신청서 이미지를 한 번에 업로드하여 목록형(DB) 엑셀로 추출합니다.</p>
        </header>

        <!-- 이미지 업로드 섹션 -->
        <section id="uploadSection" class="upload-section">
            <div class="drop-zone" id="dropZone">
                <span class="drop-icon">📸</span>
                <h3>여러 장의 이미지를 드래그 앤 드롭하세요</h3>
                <p>지원 형식: JPG, PNG (최대 50장 동시 처리 가능)</p>
                <input type="file" id="fileInput" accept="image/*" multiple hidden>
            </div>
            
            <div id="previewArea" class="hidden">
                <h4 style="margin-bottom: 10px; color: var(--primary-color);">업로드 대기 중인 이미지</h4>
                <div id="imageGallery" class="image-gallery"></div>
                <div style="margin-top:20px;">
                    <button id="analyzeBtn" class="btn primary-btn">✨ 일괄 AI 변환 시작</button>
                    <button id="clearBtn" class="btn secondary-btn" style="margin-left: 10px;">초기화</button>
                </div>
            </div>
        </section>

        <!-- 로딩 오버레이 -->
        <div id="loadingOverlay" class="hidden">
            <div class="spinner"></div>
            <p id="loadingMsg">다량의 이미지를 AI가 병렬로 분석 중입니다. 잠시만 기다려주세요...</p>
        </div>

        <!-- 결과 리뷰 테이블 섹션 -->
        <section id="resultSection" class="result-section hidden">
            <h2>인식 결과 검토 및 수정</h2>
            <p>AI가 인식한 결과를 표에서 확인하고 셀을 클릭하여 오타를 수정하세요.</p>
            
            <div id="dynamicTablesContainer">
                <!-- JS에서 양식 종류별로 동적 테이블 렌더링 -->
            </div>

            <div class="action-buttons">
                <button id="resetBtn" class="btn secondary-btn">처음으로</button>
                <button id="downloadExcelBtn" class="btn primary-btn">엑셀 다운로드 📥</button>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
